name: Publish two game editors

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v6

      - name: Extract website
        run: |
          unzip -q TATEEHACK-Two-Games-GitHub.zip 'dist/*' -d website
          test -f website/dist/index.html
          test -f website/dist/rowe/index.html
          test -f website/dist/wishes.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
